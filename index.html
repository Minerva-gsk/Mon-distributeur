<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communauté</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .header { color: #eab308; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        
        /* Ligne des boutons */
        .boutons-rangee {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .onglet {
            flex: 1;
            padding: 12px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
        }
        .actif { background-color: #eab308; color: black; }
        .inactif { background-color: #2a2a2a; color: white; border: 1px solid #444; }
        
        /* Bouton Administration */
        .admin-btn {
            width: 100%;
            padding: 12px;
            border-radius: 20px;
            background: transparent;
            color: #eab308;
            border: 1px solid #eab308;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Style des publications */
        .post {
            background-color: #1e1e1e;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .post-header { display: flex; align-items: center; margin-bottom: 10px; }
        .avatar {
            width: 40px; height: 40px;
            background-color: #eab308;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: black; font-weight: bold; margin-right: 10px;
        }
        .post-info h4 { margin: 0; color: white; }
        .post-info span { font-size: 12px; color: #888; }
        .post-content { margin-bottom: 10px; }
        .post-actions { display: flex; gap: 10px; }
        .action-btn {
            background-color: #eab308; color: black;
            border: none; padding: 8px 15px; border-radius: 15px;
            font-weight: bold; display: flex; align-items: center; gap: 5px;
        }

        /* --- STYLE DE LA MESSAGERIE --- */
        #chat-box {
            display: none; /* Caché par défaut */
            position: fixed;
            bottom: 20px; right: 20px;
            width: 300px; height: 400px;
            background-color: #1e1e1e;
            border: 1px solid #444;
            border-radius: 10px;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .chat-header {
            background-color: #eab308; color: black;
            padding: 10px; border-radius: 10px 10px 0 0;
            font-weight: bold; display: flex; justify-content: space-between;
        }
        .chat-header button { background: none; border: none; font-weight: bold; font-size: 16px; cursor: pointer; }
        .chat-messages { flex: 1; padding: 10px; overflow-y: auto; font-size: 14px; }
        .chat-input-area { display: flex; padding: 10px; border-top: 1px solid #444; }
        .chat-input-area input {
            flex: 1; padding: 8px; border-radius: 5px; border: none; background-color: #333; color: white;
        }
        .chat-input-area button {
            background-color: #eab308; border: none; padding: 8px 15px; margin-left: 5px; border-radius: 5px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">Communauté</div>

    <!-- LES BOUTONS DE NAVIGATION -->
    <div class="boutons-rangee">
        <button class="onglet actif">Publications</button>
        <button class="onglet inactif">À juger</button>
        <!-- LE NOUVEAU BOUTON MESSAGERIE -->
        <button class="onglet inactif" onclick="toggleChat()">💬</button>
    </div>

    <button class="admin-btn">🛡️ Administration</button>

    <!-- PUBLICATION 1 -->
    <div class="post">
        <div class="post-header">
            <div class="avatar">R</div>
            <div class="post-info">
                <h4>R kiff</h4>
                <span>7 h</span>
            </div>
        </div>
        <div class="post-content">Yo la mif</div>
        <div class="post-actions">
            <button class="action-btn">♥ 1</button>
            <button class="action-btn" style="background:#2a2a2a; color:white;">💬 0</button>
        </div>
    </div>

    <!-- PUBLICATION 2 -->
    <div class="post">
        <div class="post-header">
            <div class="avatar" style="background:black; border:1px solid #eab308; color:#eab308;">M</div>
            <div class="post-info">
                <h4>Minerva ✔️</h4>
                <span>14 h</span>
            </div>
        </div>
        <div class="post-content">Salut la famille @Visa</div>
        <div class="post-actions">
            <button class="action-btn">♥ 3</button>
            <button class="action-btn" style="background:#2a2a2a; color:white;">💬 1</button>
        </div>
    </div>

    <!-- FENÊTRE DE MESSAGERIE INSTANTANÉE -->
    <div id="chat-box">
        <div class="chat-header">
            Messagerie instantanée
            <button onclick="toggleChat()">✖</button>
        </div>
        <div class="chat-messages" id="chat-messages">
            <p style="color:#888; text-align:center;">Bienvenue dans le chat !</p>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Écris un message..." onkeypress="if(event.key === 'Enter') envoyerMessage()">
            <button onclick="envoyerMessage()">Envoyer</button>
        </div>
    </div>

    <!-- JAVASCRIPT POUR LE CHAT -->
    <script>
        function toggleChat() {
            const chatBox = document.getElementById('chat-box');
            if (chatBox.style.display === 'flex') {
                chatBox.style.display = 'none';
            } else {
                chatBox.style.display = 'flex';
            }
        }

        function envoyerMessage() {
            const input = document.getElementById('chat-input');
            const messages = document.getElementById('chat-messages');
            
            if (input.value.trim() !== "") {
                // Ajouter le message
                const msgDiv = document.createElement('div');
                msgDiv.style.marginBottom = "5px";
                msgDiv.style.textAlign = "right";
                msgDiv.innerHTML = `<span style="background:#eab308; color:black; padding:5px 10px; border-radius:10px; display:inline-block;">${input.value}</span>`;
                
                messages.appendChild(msgDiv);
                input.value = ""; // Vider l'input
                messages.scrollTop = messages.scrollHeight; // Scroller vers le bas
            }
        }
    </script>
</body>
</html>
